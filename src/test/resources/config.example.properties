# Copy to config.properties; the copied file is ignored.
platform=iOS
automationName=XCUITest
executionMode=simulator
bundleId=com.example.iosapp
simulator.device=ios-simulator-example
real.device=auto
real.appPath=/path/to/signed/app.ipa
real.xcodeOrgId=YOUR_TEAM_ID
real.xcodeSigningId=Apple Development
real.wdaSigningCertSha1=YOUR_CERTIFICATE_SHA1
appiumUrl=http://127.0.0.1:4723
simulator.wdaLocalPort=8102
real.wdaLocalPort=8103
newCommandTimeout=240
language=en
locale=en_US
